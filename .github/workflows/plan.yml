
name: Terraform Plan

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  generate-matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.generate.outputs.matrix }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine SHAs
        id: shas
        run: |
          if [ "${{ github.event_name }}" == "pull_request" ]; then
            echo "sha1=${{ github.event.pull_request.base.sha }}" >> $GITHUB_OUTPUT
            echo "sha2=${{ github.sha }}" >> $GITHUB_OUTPUT
          else
            echo "sha1=${{ github.event.before }}" >> $GITHUB_OUTPUT
            echo "sha2=${{ github.sha }}" >> $GITHUB_OUTPUT
          fi

      - name: Generate Matrix
        id: generate
        run: |
          python3 scripts/generate_matrix.py ${{ steps.shas.outputs.sha1 }} ${{ steps.shas.outputs.sha2 }} > matrix.json
          echo "matrix=$(cat matrix.json)" >> $GITHUB_OUTPUT

  plan:
    needs: generate-matrix
    if: fromJson(needs.generate-matrix.outputs.matrix).flat[0]
    strategy:
      matrix:
        include: ${{ fromJson(needs.generate-matrix.outputs.matrix).flat }}
    uses: ./.github/workflows/reusable.yml
    with:
      stack: ${{ matrix.stack }}
      region: ${{ matrix.region }}
      command: plan
    secrets:
      assume_role_arn: ${{ secrets.ASSUME_ROLE_ARN }}
      aws_role_session_name: ${{ secrets.AWS_ROLE_SESSION_NAME }}