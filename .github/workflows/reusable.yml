
name: Reusable Terraform Workflow

on:
  workflow_call:
    inputs:
      region:
        required: true
        type: string
      stacks:
        required: true
        type: string
        description: 'JSON array of stack names'
      command:
        required: true
        type: string
        description: 'plan, apply, or drift'
    secrets:
      ASSUME_ROLE_ARN:
        required: true
      AWS_ROLE_SESSION_NAME:
        required: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  terraform:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        stack: ${{ fromJson(inputs.stacks) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.5.0"

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.ASSUME_ROLE_ARN }}
          aws-region: ${{ inputs.region }}
          role-session-name: ${{ secrets.AWS_ROLE_SESSION_NAME || 'GitHubActions' }}

      - name: Terraform Init
        working-directory: stacks/${{ matrix.stack }}
        run: |
          terraform init \
            -backend-config="key=stacks/${{ matrix.stack }}/${{ inputs.region }}/terraform.tfstate" \
            -backend-config="region=us-east-1"

      - name: Terraform Plan
        if: inputs.command == 'plan'
        working-directory: stacks/${{ matrix.stack }}
        run: terraform plan -var="region=${{ inputs.region }}"

      - name: Terraform Plan (for Apply)
        if: inputs.command == 'apply'
        working-directory: stacks/${{ matrix.stack }}
        run: terraform plan -var="region=${{ inputs.region }}" -out=tfplan

      - name: Terraform Apply
        if: inputs.command == 'apply'
        working-directory: stacks/${{ matrix.stack }}
        run: terraform apply -auto-approve tfplan

      - name: Terraform Plan (Drift Detection)
        if: inputs.command == 'drift'
        working-directory: stacks/${{ matrix.stack }}
        run: terraform plan -var="region=${{ inputs.region }}" -detailed-exitcode
