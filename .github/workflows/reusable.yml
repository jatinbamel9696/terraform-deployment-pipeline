
name: Reusable Terraform Workflow

on:
  workflow_call:
    inputs:
      stack:
        required: false
        type: string
      region:
        required: true
        type: string
      stacks:
        required: false
        type: string
        description: 'JSON array of stacks to process'
      stage:
        required: false
        type: number
        description: 'Deployment stage number'
      command:
        required: true
        type: string
        description: 'plan, apply, or drift'
    secrets:
      ASSUME_ROLE_ARN:
        required: true
      AWS_ROLE_SESSION_NAME:
        required: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      stacks: ${{ steps.set-stacks.outputs.stacks }}
    steps:
      - name: Set stacks
        id: set-stacks
        env:
          STACKS_INPUT: ${{ inputs.stacks }}
        run: |
          if [ -n "$STACKS_INPUT" ]; then
            echo "stacks=$(echo "$STACKS_INPUT" | jq -c .)" >> $GITHUB_OUTPUT
          else
            echo "stacks=[\"${{ inputs.stack }}\"]" >> $GITHUB_OUTPUT
          fi

  terraform:
    needs: prepare
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    strategy:
      matrix:
        stack: ${{ fromJson(needs.prepare.outputs.stacks) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.5.0"

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.ASSUME_ROLE_ARN }}
          aws-region: ${{ inputs.region }}
          role-session-name: ${{ secrets.AWS_ROLE_SESSION_NAME || 'GitHubActions' }}

      - name: Terraform Init
        working-directory: stacks/${{ matrix.stack }}
        run: |
          terraform init \
            -backend-config="key=stacks/${{ matrix.stack }}/${{ inputs.region }}/terraform.tfstate" \
            -backend-config="region=us-east-1" \
            -upgrade

      - name: Terraform Plan
        if: inputs.command == 'plan'
        working-directory: stacks/${{ matrix.stack }}
        run: terraform plan -var="region=${{ inputs.region }}" -out=tfplan

      - name: Terraform Apply
        if: inputs.command == 'apply'
        working-directory: stacks/${{ matrix.stack }}
        run: terraform apply -auto-approve tfplan

      - name: Terraform Plan (Drift Detection)
        if: inputs.command == 'drift'
        working-directory: stacks/${{ matrix.stack }}
        run: terraform plan -var="region=${{ inputs.region }}" -detailed-exitcode
